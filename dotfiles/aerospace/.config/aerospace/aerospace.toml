# ~/.config/aerospace/aerospace.toml
# Numeric workspaces keep applications grouped by role across two monitors.

# Config version for compatibility (enables persistent-workspaces and other v2 features)
config-version = 2

# Keep the small, fixed workspace set available even when empty
persistent-workspaces = ['0', '1', '2', '3', '4', '5']

# Start AeroSpace at login
start-at-login = true

# Reload the config automatically after tracked dotfile changes
auto-reload-config = true

# Auto-start commands after AeroSpace startup
after-startup-command = []

# Include stowed personal scripts while preserving AeroSpace's Homebrew paths
exec.env-vars.PATH = '${HOME}/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout and container settings
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Automatically unhide macOS hidden apps
automatically-unhide-macos-hidden-apps = true

# Use QWERTY key layout
[key-mapping]
preset = 'qwerty'

# Window gaps settings
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.bottom = 5
outer.top = 5
outer.right = 5

# Main binding mode
[mode.main.binding]
# Layout controls
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Window focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Window movement
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize windows
alt-minus = 'resize smart -100'
alt-equal = 'resize smart +100'

# Workspace switching with cmd (⌘) key
cmd-backtick = 'workspace 0' # Terminal workspace
cmd-1 = 'workspace 1'        # Code editor workspace
cmd-2 = 'workspace 2'        # Browser workspace
cmd-3 = 'workspace 3'        # Documents workspace
cmd-4 = 'workspace 4'        # Chat workspace
cmd-5 = 'workspace 5'        # Music workspace

# Move windows to workspaces (option+shift+number)
alt-shift-backtick = 'move-node-to-workspace 0 --focus-follows-window'
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

# Focus monitors
cmd-shift-left = 'focus-monitor --wrap-around left'
cmd-shift-right = 'focus-monitor --wrap-around right'

# Move the focused window between monitors
alt-shift-left = 'move-node-to-monitor --focus-follows-window --wrap-around left'
alt-shift-right = 'move-node-to-monitor --focus-follows-window --wrap-around right'

# Toggle between previous workspace
alt-tab = 'workspace-back-and-forth'

# Enter service mode for additional commands
alt-shift-semicolon = 'mode service'

# Disable cmd-h (Hide App) - often hit by accident
cmd-h = []
cmd-alt-h = []

# Service binding mode for less frequent operations
[mode.service.binding]
esc = ['reload-config', 'mode main']
alt-shift-semicolon = 'mode main'
r = ['flatten-workspace-tree', 'mode main'] # Flatten nested containers
b = ['balance-sizes', 'mode main'] # Balance window sizes
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# Join windows
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Volume controls
down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# Float dialog-like apps (work better not tiled)
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences || test %{app-bundle-id} = com.apple.calculator || test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = cc.ffitch.shottr'
run = 'layout floating'

# Ghostty to workspace 0
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.mitchellh.ghostty'
run = 'move-node-to-workspace 0'

# Code and AI editors to workspace 1
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.microsoft.VSCode || test %{app-bundle-id} = com.todesktop.230313mzl4w4u92 || test %{app-bundle-id} = com.openai.codex || test %{app-bundle-id} = ai.opencode.desktop || test %{app-bundle-id} = com.t3tools.t3code || test %{app-bundle-id} = com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 1'

# Documents to workspace 3
[[on-window-detected]]
if = 'test %{app-name} ~= tldraw'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if = 'test %{app-bundle-id} = notion.id || test %{app-bundle-id} = com.cron.electron || test %{app-bundle-id} = com.apple.iCal'
run = 'move-node-to-workspace 3'

# Slack huddle pop-outs look like dialogs, so AeroSpace floats them by default.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap && test %{window-title} ~= ^Huddle:'
run = ['move-node-to-workspace 4', 'layout tiling']

# Chat to workspace 4
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap || test %{app-bundle-id} = com.microsoft.teams2'
run = 'move-node-to-workspace 4'

# Music to workspace 5
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.spotify.client'
run = 'move-node-to-workspace 5'

# Browsers to workspace 2
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.Safari || test %{app-bundle-id} = com.google.Chrome || test %{app-bundle-id} = com.brave.Browser || test %{app-bundle-id} = net.imput.helium'
run = 'move-node-to-workspace 2'

# Assign specific workspaces to monitors
[workspace-to-monitor-force-assignment]
"0" = 'main' # Terminal (Ghostty) on main monitor
"1" = 'main' # Code editors on main monitor
"2" = 'main' # Browsers on main monitor
"3" = 'main' # Documents on main monitor
"4" = 'main' # Chat on main monitor
"5" = ['secondary', 'main'] # Music on secondary monitor, main as fallback
