session: psci

root: ~/code/psci

windows:
  - name: code
    root: chatbot-ui
    selected: true
    commands:
      - nvim .

  - name: terminals
    root: chatbot-ui
    layout: main-horizontal
    panes:
      - type: horizontal
        root: labs/agenting
      - type: horizontal
        root: shared-services-api

  - name: psci-hq
    root: ~/code/psci-hq
    commands:
      - pnpm dev
