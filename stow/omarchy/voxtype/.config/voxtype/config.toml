# Voxtype is driven by Hyprland bindings so shortcuts remain visible in the
# Omarchy keybinding menu and do not require direct evdev device access.
state_file = "auto"
engine = "parakeet"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
pause_media = true

[parakeet]
model = "parakeet-tdt-0.6b-v3-int8"
model_type = "tdt"
on_demand_loading = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1

[osd]
enabled = true
frontend = "gtk4"
position = "bottom-center"
